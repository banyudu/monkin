<svg xmlns="http://www.w3.org/2000/svg" width="300" height="250" viewBox="0 0 300 250">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#593C38"/>
      <stop offset="0.62" stop-color="#36272B"/>
      <stop offset="1" stop-color="#201C25"/>
    </linearGradient>
    <linearGradient id="muzzle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8B68B"/>
      <stop offset="1" stop-color="#A87D5B"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#77504A"/>
      <stop offset="1" stop-color="#30232B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#07070B" flood-opacity="0.42"/>
    </filter>
  </defs>

  <ellipse cx="150" cy="222" rx="86" ry="12" fill="#07070B" opacity="0.22"/>
  <g filter="url(#shadow)">
    <path d="M87 77 C82 48 103 35 126 49 C140 34 160 34 175 49 C199 35 220 49 214 78 C235 96 237 141 215 169 C197 194 172 204 150 204 C128 204 103 194 85 169 C63 141 65 96 87 77Z" fill="url(#fur)" stroke="#17151B" stroke-width="7" stroke-linejoin="round"/>
    <ellipse cx="74" cy="112" rx="29" ry="35" fill="url(#ear)" stroke="#17151B" stroke-width="7"/>
    <ellipse cx="226" cy="112" rx="29" ry="35" fill="url(#ear)" stroke="#17151B" stroke-width="7"/>

    <!-- burgundy ear insets -->
    <path d="M61 111 Q74 95 87 111 Q74 128 61 111Z" fill="#8D4650" stroke="#17151B" stroke-width="4"/>
    <path d="M213 111 Q226 95 239 111 Q226 128 213 111Z" fill="#8D4650" stroke="#17151B" stroke-width="4"/>

    <!-- asymmetric night-owl tuft -->
    <path d="M112 58 Q120 31 138 52 Q151 38 162 54 Q179 28 188 60 Q166 69 149 61 Q131 71 112 58Z" fill="#69453E" stroke="#17151B" stroke-width="5" stroke-linejoin="round"/>
    <path d="M127 55 Q148 46 174 55" fill="none" stroke="#9A6657" stroke-width="3" stroke-linecap="round"/>

    <ellipse cx="150" cy="141" rx="69" ry="48" fill="url(#muzzle)" stroke="#17151B" stroke-width="5"/>

    <!-- alert, golden eyes -->
    <path d="M100 107 Q115 94 131 105" fill="none" stroke="#17151B" stroke-width="7" stroke-linecap="round"/>
    <path d="M169 105 Q184 94 200 107" fill="none" stroke="#17151B" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="117" cy="120" rx="11" ry="17" fill="#DFAF4F" stroke="#17151B" stroke-width="4"/>
    <ellipse cx="183" cy="120" rx="11" ry="17" fill="#DFAF4F" stroke="#17151B" stroke-width="4"/>
    <ellipse cx="117" cy="121" rx="3" ry="12" fill="#211A20"/>
    <ellipse cx="183" cy="121" rx="3" ry="12" fill="#211A20"/>
    <circle cx="121" cy="114" r="3.5" fill="#FFF5D6"/>
    <circle cx="187" cy="114" r="3.5" fill="#FFF5D6"/>

    <path d="M88 143 Q101 136 113 143" fill="none" stroke="#984F55" stroke-width="5" stroke-linecap="round" opacity="0.72"/>
    <path d="M187 143 Q199 136 212 143" fill="none" stroke="#984F55" stroke-width="5" stroke-linecap="round" opacity="0.72"/>

    <path d="M143 132 Q150 127 157 132 L154 139 Q150 142 146 139Z" fill="#392128"/>
    <!-- sly smile -->
    <path d="M132 152 Q149 164 169 149" fill="none" stroke="#392128" stroke-width="6" stroke-linecap="round"/>
    <path d="M151 157 Q160 158 166 153" fill="none" stroke="#984F55" stroke-width="3" stroke-linecap="round"/>

    <!-- small burgundy crescent pin -->
    <path d="M212 66 A18 18 0 1 0 212 100 A13 13 0 1 1 212 66Z" fill="#A65359" stroke="#17151B" stroke-width="4"/>
    <circle cx="226" cy="72" r="3" fill="#DFAF4F"/>
