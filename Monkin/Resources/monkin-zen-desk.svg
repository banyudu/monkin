    <circle cx="117" cy="120" r="3" fill="#D3A95D"/>
    <circle cx="183" cy="120" r="3" fill="#D3A95D"/>

    <path d="M89 143 Q101 138 112 143" fill="none" stroke="#9B6D5A" stroke-width="5" stroke-linecap="round" opacity="0.62"/>
