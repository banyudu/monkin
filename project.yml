name: Monkin
options:
  bundleIdPrefix: com.monkin
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: 5.0
    MACOSX_DEPLOYMENT_TARGET: 13.0
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  Monkin:
    type: application
    platform: macOS
    sources:
      - path: Monkin
    resources:
      - path: Monkin/Resources
    dependencies:
      - package: RiveRuntime
        product: RiveRuntime
    settings:
      base:
        # RiveRuntime 6.22.1 supports macOS 13.1 and later. Keep this
        # target-specific so the screen saver stays on its existing baseline.
        MACOSX_DEPLOYMENT_TARGET: 13.1
        PRODUCT_BUNDLE_IDENTIFIER: com.banyudu.monkin
        PRODUCT_NAME: Monkin
        INFOPLIST_FILE: Monkin/Info.plist
        CODE_SIGN_ENTITLEMENTS: Monkin/Monkin.entitlements
        DEVELOPMENT_TEAM: RYLS8UDY5D
        CODE_SIGN_IDENTITY: Developer ID Application
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
    scheme:
      gatherCoverageData: false
      commandLineArguments: {}
  MonkinScreenSaver:
    type: bundle
    platform: macOS
    sources:
      - path: Monkin/MonkinScreenSaverView.swift
      - path: Monkin/PetView.swift
      - path: Monkin/SportsPropView.swift
      - path: Monkin/MonkinFigureSpec.swift
      - path: Monkin/MonkinMotion.swift
      - path: Monkin/MonkinPose.swift
      - path: Monkin/MonkinSVGRenderer.swift
      - path: Monkin/MotionProgram.swift
      - path: Monkin/MotionInterpreter.swift
      - path: Monkin/MotionPresets.swift
      - path: Monkin/Resources
        type: resource
        excludes:
          - monkin-mascot.riv
          - monkin-monkey.riv
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banyudu.monkin.screensaver
        PRODUCT_NAME: Monkin
        WRAPPER_EXTENSION: saver
        INFOPLIST_FILE: Monkin/ScreenSaver-Info.plist
        CODE_SIGN_ENTITLEMENTS: Monkin/Monkin.entitlements
        DEVELOPMENT_TEAM: RYLS8UDY5D
        CODE_SIGN_IDENTITY: Developer ID Application
        OTHER_LDFLAGS: $(inherited) -framework ScreenSaver
    scheme:
      gatherCoverageData: false
      commandLineArguments: {}
packages:
  RiveRuntime:
    url: https://github.com/rive-app/rive-ios
    exactVersion: 6.22.1
